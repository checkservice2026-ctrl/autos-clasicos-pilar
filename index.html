<style>
:root{--ac:#7a1426;--r:14px;--bg:#f4f5f8;--sf:#fff;--tx:#14171f;--mut:#6b7280;--bd:#e5e7eb;--hd:rgba(255,255,255,.82);--inp:#fff;--sh:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.07);
--bordo:var(--ac);--negro:var(--tx);--crema:var(--bg);--gris:var(--mut);--metal:var(--bd);--bl:var(--sf);--grad:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#fff))}
[data-theme=dark]{--bg:#0e1015;--sf:#171a22;--tx:#eceef4;--mut:#9aa1b2;--bd:#272b37;--hd:rgba(23,26,34,.82);--inp:#10131a;--sh:0 1px 2px #0006,0 10px 28px #0005;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .25s,color .25s;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}h2,h3{letter-spacing:-.01em}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#ffffff,#e8e1d2);color:#1d1d1d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:99;transition:opacity .6s}
#splash h1{letter-spacing:.25em;font-weight:400;font-size:clamp(1.4rem,6vw,2.6rem);margin:.4em 1em;animation:up 2s ease both}
#splash p{font-style:italic;color:#8a7440;animation:up 2s .8s ease both}
#splash #logo{width:min(88vw,460px);height:auto;max-height:52vh;object-fit:contain;animation:up 1.5s ease both}
.pbar{width:min(70vw,360px);height:6px;border-radius:6px;background:#00000014;overflow:hidden;margin:1.6em 0 .5em}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#fff));border-radius:6px}
#ppct{color:#8a7440;letter-spacing:.15em;font-size:.9rem;font-variant-numeric:tabular-nums}
#login .lg{display:block;max-width:150px;max-height:130px;margin:0 auto .5em;object-fit:contain}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hide{display:none!important}
header{background:var(--hd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx);padding:.7em 1em;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header b{letter-spacing:.1em;font-size:.95rem;display:flex;align-items:center;gap:.6em}header b:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--grad)}
header small{color:var(--mut);margin-right:.4em}.hlogo{height:40px;width:auto;object-fit:contain}#nextev{flex:1;text-align:center;font-size:.82rem;cursor:pointer;padding:0 .8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nextev small{letter-spacing:.12em;font-size:.65rem}.bell{position:relative}.dd{position:relative;display:inline-block;margin:.2em .3em .2em 0}.dd summary{list-style:none;cursor:pointer;padding:.5em 1em;border:1px solid var(--bd);border-radius:99px;background:var(--sf);color:var(--tx);font-weight:600;user-select:none}.dd summary::-webkit-details-marker{display:none}.ddm{position:absolute;z-index:30;left:0;top:calc(100% + 6px);min-width:250px;max-width:86vw;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:.4em;display:flex;flex-direction:column}.ddm button{width:100%;text-align:left;white-space:normal;border:0;background:transparent;box-shadow:none;border-radius:10px;padding:.65em .8em;min-height:0}.ddm button:hover{background:var(--bd)}.ddm .sec{font-size:.66rem;letter-spacing:.12em;color:var(--mut);padding:.6em .8em .15em}.bell i{position:absolute;top:-5px;right:-5px;background:#b91c1c;color:#fff;border-radius:99px;font-size:.65rem;padding:0 5px;font-style:normal;line-height:1.4}@media(max-width:600px){#nextev small{display:none}#nextev{font-size:.7rem}.hlogo{height:30px}}
nav{display:flex;gap:.4em;overflow-x:auto;padding:.6em .7em;scrollbar-width:none}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:.5em 1em;border-radius:99px;cursor:pointer;transition:all .15s}
nav button:hover{border-color:var(--ac)}nav button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
main{padding:1em;max-width:980px;margin:auto;animation:pop .3s ease}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1em;margin:.7em 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8em}
.num{font-size:2rem;font-weight:700;color:var(--ac)}
.b{background:var(--grad);color:#fff;border:0;padding:.7em 1.2em;border-radius:calc(var(--r)*.75);cursor:pointer;margin:.2em;font-weight:600;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 32%,transparent);transition:transform .12s,box-shadow .15s,filter .15s}
.b:hover{filter:brightness(1.08);transform:translateY(-1px)}.b:active{transform:scale(.97)}
.b.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.b.l{background:transparent;color:var(--ac);border:1.5px solid color-mix(in srgb,var(--ac) 45%,transparent);box-shadow:none}.b.l:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.b.big{width:100%;padding:1.05em;font-size:1.05rem}
input,select{width:100%;padding:.7em .9em;margin:.25em 0 .8em;border:1.5px solid var(--bd);border-radius:calc(var(--r)*.7);background:var(--inp);color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,button:focus-visible{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
label{font-size:.82rem;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.65em .5em;border-bottom:1px solid var(--bd);font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}tbody tr:hover{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.wrap{overflow-x:auto}
.badge{padding:.2em .7em;border-radius:99px;font-size:.72rem;font-weight:600;background:var(--bd)}
.ACTIVO,.CONFIRMADO,.PUBLICADO{background:rgba(34,197,94,.2)}.ACREDITADO{background:rgba(59,130,246,.2)}.BAJA,.CANCELADO{background:rgba(239,68,68,.2)}.SUSPENDIDO,.PREINSCRIPTO,.BORRADOR{background:rgba(245,158,11,.22)}.ESPERA{background:rgba(139,92,246,.25)}
#modal{position:fixed;inset:0;background:#0008;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#modal>div{background:var(--sf);color:var(--tx);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:1.2em;border-radius:22px 22px 0 0;animation:pop .25s ease}
@media(min-width:600px){#modal{align-items:center}#modal>div{border-radius:22px}}
#toast{position:fixed;bottom:1em;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:.7em 1.2em;border-radius:99px;z-index:99;box-shadow:var(--sh)}
.res{text-align:center;padding:1.5em;border-radius:var(--r);color:#fff;font-size:1.3rem}
.ok{background:#16a34a}.warn{background:#d97706}.bad{background:#dc2626}
.tk{text-align:center;border:2px dashed var(--ac);border-radius:var(--r);padding:1em;background:var(--sf)}
.tk h3{letter-spacing:.12em;color:var(--ac);margin:.2em}
.empty{text-align:center;color:var(--mut);padding:1.5em}.loader{text-align:center;padding:2em;color:var(--mut)}
#login{max-width:400px;margin:10vh auto;padding:1.5em;position:relative}
.gear{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:99px;min-width:44px;cursor:pointer;margin:0 .2em}
#login .gear{position:absolute;top:.7em;right:.7em}
.seg{display:flex;gap:.3em;background:var(--bg);padding:.25em;border-radius:99px;margin:.3em 0 1em}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);padding:.5em;border-radius:99px;cursor:pointer;min-height:38px}.seg button.on{background:var(--grad);color:#fff}
.sw{display:flex;gap:.6em;margin:.4em 0 1em;flex-wrap:wrap}.sw button{width:40px;height:40px;min-height:0;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1.5px var(--bd);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--tx)}
button{min-height:44px;-webkit-tap-highlight-color:transparent}input,select{font-size:16px;min-height:44px}
td:last-child{white-space:nowrap}
@media(max-width:600px){td,th{padding:.4em .3em;font-size:.82rem}main{padding:.7em}.b{padding:.7em .9em}}
@media(min-width:900px){#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/3}nav{flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding:1em;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);border-right:1px solid var(--bd)}
nav button{border-radius:calc(var(--r)*.7);text-align:left;width:100%}main{max-width:1150px;width:100%;margin:0;padding:1.5em 2em}}
#scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
#scan #reader{flex:1;min-height:0;overflow:hidden}#scan #reader>div,#scan #reader video{width:100%!important;height:100%!important;object-fit:cover}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:1em 1em calc(1em + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000c);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3em}
.scanbar b{font-size:1.2rem}
#net{position:fixed;bottom:0;left:0;right:0;background:#b45309;color:#fff;text-align:center;padding:.5em;font-size:.85rem;z-index:60}
@media print{.tk{background:#fff!important;color:#000!important;border-color:#000!important}.tk h3{color:#000!important}header,nav,main,#login,.b{display:none!important}#modal{position:static;background:none}}
</style>
<script>try{var u=JSON.parse(localStorage.getItem("acp-ui")||"{}"),d=document.documentElement,t=u.t||"auto";d.dataset.theme=t=="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):t;if(u.a)d.style.setProperty("--ac",u.a);if(u.r)d.style.setProperty("--r",u.r)}catch(e){}</script>
</head>
<body>

<div id="splash">
  <img id="logo" src="logo.png" alt="Autos Clásicos Pilar" onerror="this.style.display='none'">
  <div class="pbar"><i id="pfill"></i></div><div id="ppct">0%</div>
</div>

<div id="pub" class="hide" style="max-width:420px;margin:auto;padding:1em"></div>

<div id="login" class="hide card"><button class="gear" data-a="cfg" title="Apariencia">⚙️</button>
  <img class="lg" src="logo.png" alt="" onerror="this.style.display='none'"><h2 style="text-align:center;color:var(--bordo);letter-spacing:.1em">AUTOS CLÁSICOS PILAR</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <button class="b big" data-a="login">INGRESAR</button>
  <button class="b l big" data-a="reset" style="margin-top:.5em">Recuperar contraseña</button>
</div>

<div id="app" class="hide">
  <header><img class="hlogo" src="logo.png" alt="Autos Clásicos Pilar" onerror="this.outerHTML='<b>AUTOS CLÁSICOS PILAR</b>'"><div id="nextev" data-a="nxev"></div><span><small id="who"></small> <button class="gear bell" data-a="bell" title="Inscripciones pendientes">🔔<i id="bn" class="hide"></i></button><button class="gear" data-a="cfg" title="Apariencia">⚙️</button><button class="b g" data-a="logout">Salir</button></span></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="scan" class="hide"><div id="reader"></div><div class="scanbar"><small>Acreditando en</small><b id="scev"></b><button class="b g" data-a="scanx">✕ Cancelar</button></div></div>
<div id="net" class="hide">📴 Sin conexión — los cambios se guardan y se sincronizan al volver internet</div>
<div id="modal" class="hide"><div id="mbody"></div></div>

<!-- LIBRERÍAS CDN: QR (generar) y lectura QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script type="module">
/* ==============================
FIREBASE
============================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,getDocFromCache,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,serverTimestamp,runTransaction,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// >>> PEGÁ ACÁ LAS CREDENCIALES (Firebase Console > Configuración del proyecto > Tus apps > Web) <<<
const firebaseConfig = {
  apiKey: "AIzaSyAuhSJWPWWptsgf_O2s_5UbjpGurWj0nQ0",
  authDomain: "autos-clasicos-pilar.firebaseapp.com",
  projectId: "autos-clasicos-pilar",
  storageBucket: "autos-clasicos-pilar.firebasestorage.app",
  messagingSenderId: "694551333250",
  appId: "1:694551333250:web:ba370af1150e781d6ae79b"
};
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=(()=>{try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch{return getFirestore(app)}})(),st=getStorage(app),auth2=getAuth(initializeApp(firebaseConfig,'sec'));
const APPCHECK_KEY='';/* pegá acá la clave reCAPTCHA v3 de Firebase App Check */
if(APPCHECK_KEY)import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js').then(m=>m.initializeAppCheck(app,{provider:new m.ReCaptchaV3Provider(APPCHECK_KEY),isTokenAutoRefreshEnabled:true})).catch(e=>console.error('AppCheck',e));

/* ==============================
UI
============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{let t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const modal=h=>{$('#mbody').innerHTML=h;$('#modal').classList.remove('hide')};
const closeM=()=>{$('#modal').classList.add('hide');$('#mbody').innerHTML=''};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
const main=h=>$('#main').innerHTML=h;
const loading=()=>main('<div class="loader">Cargando…</div>');
const badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;
const acts={};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&acts[t.dataset.a])Promise.resolve(acts[t.dataset.a](t.dataset.i,t)).catch(x=>{console.error(x);toast('Error: '+(x.code||x.message))})});

/* ==============================
DATABASE
============================== */
const all=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const where1=async(c,f,v)=>(await getDocs(query(collection(db,c),where(f,'==',v)))).docs.map(d=>({id:d.id,...d.data()}));
let me=null,role='SOCIO',PERM=null;
const staff=()=>['ADMIN','COMISION','ORGANIZADOR'].includes(role);

/* ==============================
AUDITORÍA
============================== */
const log=(accion,entidad,id)=>addDoc(collection(db,'auditoria'),{usuario:me?.email||'publico',accion,entidad,id,fecha:serverTimestamp(),createdAt:serverTimestamp()}).catch(()=>{});

/* ==============================
AUTHENTICATION
============================== */
acts.login=()=>signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>toast('Credenciales incorrectas'));
acts.reset=async()=>{const e=$('#em').value.trim();if(!e)return toast('Ingresá tu email');await sendPasswordResetEmail(auth,e);toast('Te enviamos un correo para restablecer la contraseña')};
acts.logout=()=>signOut(auth);
const splashDone=new Promise(r=>{const t0=performance.now(),f=$('#pfill'),pc=$('#ppct');
  const step=n=>{const k=Math.min(1,(n-t0)/5000);f.style.width=(k*100)+'%';pc.textContent=Math.floor(k*100)+'%';if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  setTimeout(()=>{f.style.width='100%';pc.textContent='100%';r()},5000)});
const authReady=new Promise(r=>onAuthStateChanged(auth,async u=>{me=u;if(u){window._rulesErr=null;try{const s=await getDoc(doc(db,'users',u.uid));role=s.exists()?s.data().role:'SOCIO'}catch(e){role='SOCIO';if(e&&e.code==='permission-denied')window._rulesErr=e.code}try{const pd=await getDoc(doc(db,'config','permisos'));PERM=pd.exists()?(pd.data().map||null):null}catch{PERM=null}}r();if(started)route()}));
let started=false;

/* ==============================
QR
============================== */
const genToken=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return 'ACP-'+new Date().getFullYear()+'-'+[...a].map(b=>b.toString(16).padStart(2,'0')).join('')};
const linkOf=t=>location.origin+location.pathname+'#acreditacion='+t;
const loadJs=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});
const ensureQR=async()=>{if(window.QRCode)return;for(const u of['https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js','https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js']){try{await loadJs(u);if(window.QRCode)return}catch{}}};
const qrCanvas=async(el,t)=>{try{await ensureQR();const c=document.createElement('canvas');await QRCode.toCanvas(c,t,{width:260,margin:4,errorCorrectionLevel:'M',color:{dark:'#000000',light:'#ffffff'}});c.style.cssText='display:block;margin:auto;max-width:100%;height:auto;border-radius:12px';el.append(c);return c}catch(e){console.error('QR',e);el.innerHTML='<div class="empty">No se pudo generar el QR.<br><small>Revisá la conexión y recargá la página.</small><br><b>'+esc(t)+'</b></div>'}};
const ticketHtml=i=>`<div class="tk"><div>AUTOS CLÁSICOS PILAR</div><h3>${esc(i.eventoNombre)}</h3><b>${esc(i.nombre)}</b><br>${esc(i.vehiculo||'')}<br>${badge(i.estado)}<div id="qr" style="margin:.8em"></div><small>${esc(i.id)}</small></div>`;
const showTicket=async i=>{
  modal(ticketHtml(i)+`<div class="grid" style="margin-top:.7em"><button class="b" data-a="dl" data-i="${i.id}">DESCARGAR QR</button><button class="b l" data-a="cp" data-i="${i.id}">COPIAR ENLACE</button><button class="b" data-a="wa" data-i="${i.id}">COMPARTIR WHATSAPP</button><button class="b g" onclick="window.print()">IMPRIMIR</button></div><button class="b l big" data-a="cm">Cerrar</button>`);
  await qrCanvas($('#qr'),i.id);
};
acts.cm=closeM;
acts.dl=()=>{const c=$('#qr canvas');if(!c)return toast('QR no disponible');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-acp.png';a.click()};
acts.cp=async t=>{await navigator.clipboard.writeText(linkOf(t));toast('Enlace copiado')};
const waNorm=raw=>{let d=String(raw||'').replace(/\D/g,'').replace(/^00/,'');if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9')&&d.length===11)d=d.slice(1);d=d.replace(/^0+/,'');if(d.length===12){for(const k of [2,3,4]){if(d.slice(k,k+2)==='15'){d=d.slice(0,k)+d.slice(k+2);break}}}return d.length===10?'549'+d:null};
const WA_ERR='WhatsApp inválido: poné código de área + número (ej: 3525 123456)';
acts.wa=async t=>{const i=(await getDoc(doc(db,'inscripciones',t))).data(),ev0=(await getDoc(doc(db,'eventos',i.eventoId))).data()||{};
  const m=`Hola ${i.nombre.split(' ')[0]} 👋\n\nYa estás inscripto en el evento de Autos Clásicos Pilar.\n\nEvento:\n${i.eventoNombre}\n\nParticipante:\n${i.nombre}\n\nVehículo:\n${i.vehiculo||'-'}\n\nPresentá el QR al ingresar para acreditar tu participación.\n${linkOf(t)}${locTxt(ev0)}\n\n¡Nos vemos!`;
  let tel=i.whatsapp||i.telefono||'';if(!tel)try{const p=(await getDoc(doc(db,i.tipoParticipante==='SOCIO'?'socios':'participantes',i.participanteId))).data()||{};tel=p.whatsapp||p.telefono||''}catch{}
  const d=waNorm(tel);if(!d)return toast(WA_ERR);
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(m),'_blank')};

/* ==============================
SOCIOS / EVENTOS (CRUD)

 cuotas:[['socio','Socio (Nº o nombre)'],['periodo','Período (AAAA-MM)'],['importe','Importe','number'],['vencimiento','Vencimiento','date'],['fechaPago','Fecha de pago','date'],['medio','Medio de pago'],['estado','Estado','PENDIENTE,PAGADA,VENCIDA']],
 ingresos:[['fecha','Fecha','date'],['categoria','Categoría'],['concepto','Concepto'],['importe','Importe','number']],

const COLS={socios:['numero','apellido','nombre','dni','estado'],eventos:['nombre','fecha','lugar','cupo','estado'],vehiculos:['socioNumero','marca','modelo','anio','patente','tipo'],cuotas:['socio','periodo','importe','vencimiento','estado'],ingresos:['fecha','categoria','concepto','medio','importe'],egresos:['fecha','categoria','concepto','proveedor','medio','importe']};

async function listView(c,title){
  loading();const rows=await all(c);
  if(c==='cuotas'&&can(c))for(const r of rows)if(r.estado==='PENDIENTE'&&r.vencimiento&&r.vencimiento<today()){r.estado='VENCIDA';updateDoc(doc(db,'cuotas',r.id),{estado:'VENCIDA',updatedAt:serverTimestamp()}).catch(()=>{})}
  const est=(FIELDS[c].find(f=>f[0]==='estado')||[])[2];
  const btn=r=>[c==='socios'?`<button class="b l" data-a="ficha" data-i="${r.id}">Ficha</button>`:'',c==='eventos'?`<button class="b" data-a="ev" data-i="${r.id}">Abrir</button>`:'',['socios','vehiculos','eventos'].includes(c)?`<button class="b l" data-a="fotos" data-i="${c}/${r.id}">Fotos</button>`:'',c==='comunicados'?`<button class="b" data-a="cwa" data-i="${r.id}">WhatsApp</button>`:'',c==='cuotas'&&can(c)&&r.estado!=='PAGADA'?`<button class="b" data-a="pay" data-i="${r.id}">Cobrar</button>`:(c==='cuotas'&&r.estado==='PAGADA'?`<button class="b l" data-a="recibo" data-i="${r.id}">🧾 Recibo</button>`:''),can(c)?`<button class="b l" data-a="edit" data-i="${c}|${r.id}">Editar</button>`:''].join('');
  main(`<h2>${title} <small>(${rows.length})</small></h2>${can(c)?`<button class="b" data-a="new" data-i="${c}">+ Nuevo</button>`:''}${c==='socios'&&can(c)?'<button class="b l" data-a="imps">📥 Importar CSV</button>':''}${c==='cuotas'&&can(c)?'<button class="b l" data-a="gen">Generar cuotas del mes</button>':''}<div style="display:flex;gap:.5em;flex-wrap:wrap"><input id="q" placeholder="Buscar…" style="flex:2;min-width:160px">${est?`<select id="fe" style="flex:1;min-width:130px"><option value="">Todos los estados</option>${est.split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:''}</div><div class="card wrap"><table><tr>${COLS[c].map(k=>`<th>${k}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr data-s="${esc(Object.values(r).filter(v=>typeof v!=='object').join(' ').toLowerCase())}" data-e="${esc(r.estado||'')}">${COLS[c].map(k=>`<td>${k==='estado'?badge(r[k]):esc(r[k])}</td>`).join('')}<td>${btn(r)}</td></tr>`).join('')}</table>${rows.length?'':'<div class="empty">Sin registros todavía</div>'}</div>`);
  const ap=()=>{const q=$('#q').value.toLowerCase(),e=$('#fe')?$('#fe').value:'';document.querySelectorAll('tr[data-s]').forEach(tr=>tr.classList.toggle('hide',!tr.dataset.s.includes(q)||!!(e&&tr.dataset.e!==e)))};
  $('#q').oninput=ap;if($('#fe'))$('#fe').onchange=ap;
}
acts.new=c=>formModal(c,null,{});
acts.edit=async k=>{const[c,id]=k.split('|');formModal(c,id,(await getDoc(doc(db,c,id))).data())};
function formModal(c,id,v){modal(`<h3>${id?'Editar':'Nuevo'}</h3>${FIELDS[c].map(f=>fld(f,v[f[0]])).join('')}<button class="b" data-a="save" data-i="${c}|${id||''}">Guardar</button>${id?`<button class="b g" data-a="del" data-i="${c}|${id}">Eliminar</button>`:''}<button class="b l" data-a="cm">Cancelar</button>`)}
acts.save=async k=>{const[c,id]=k.split('|');const d=formData();if(c==='socios'){if(!d.nombre||!d.apellido||!d.numero)return toast('Nº de socio, nombre y apellido son obligatorios');const dp=(await where1('socios','numero',d.numero)).find(x=>x.id!==id);if(dp)return toast('Ese Nº de socio ya existe')}if(c==='participantes')d.tipo='INVITADO';if(c==='eventos'&&!d.nombre)return toast('Falta el nombre');
  if(d.cupo)d.cupo=+d.cupo;if(d.importe)d.importe=+d.importe;if(d.anio)d.anio=+d.anio;
  if(id){await updateDoc(doc(db,c,id),{...d,updatedAt:serverTimestamp()});log('modificacion',c,id)}else{const r=await addDoc(collection(db,c),{...d,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});log('alta',c,r.id)}
  closeM();toast('Guardado');go(c)};
acts.del=async k=>{const[c,id]=k.split('|');if(!confirm('¿Eliminar? Queda en la Papelera hasta que la vacíes.'))return;
  try{const d=(await getDoc(doc(db,c,id))).data();await setDoc(doc(db,'papelera',c+'__'+id),{col:c,docId:id,data:d,borradoPor:me.email,fecha:serverTimestamp()})}catch{return toast('No se pudo mover a la Papelera (revisá las reglas). No se borró nada.')}
  await deleteDoc(doc(db,c,id));log('baja',c,id);closeM();go(c)};

acts.pinv=ev=>modal(`<h3>Invitado</h3>${[['nombre','Nombre'],['apellido','Apellido'],['dni','DNI'],['telefono','Teléfono'],['whatsapp','WhatsApp'],['email','Email'],['observaciones','Observaciones'],['marca','Marca'],['modelo','Modelo'],['anio','Año'],['patente','Patente'],['estadoIns','Estado de inscripción','CONFIRMADO,PREINSCRIPTO']].map(f=>fld(f,'')).join('')}<button class="b" data-a="saveinv" data-i="${ev}">Inscribir</button>`);
acts.saveinv=async ev=>{const d=formData();if(!d.nombre||!d.apellido)return toast('Nombre y apellido obligatorios');const wn=waNorm(d.whatsapp);if(!wn)return toast(WA_ERR);d.whatsapp=wn;const est=d.estadoIns;delete d.estadoIns;
  const r=await addDoc(collection(db,'participantes'),{...d,tipo:'INVITADO',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  await inscribir(ev,r.id,'INVITADO',d.nombre+' '+d.apellido,[d.marca,d.modelo,d.anio].filter(Boolean).join(' '),est,{marca:d.marca||'',modelo:d.modelo||'',anio:d.anio||''})};
async function inscribir(ev,pid,tipo,nombre,vehiculo,est,extra={}){
  const dup=(await where1('inscripciones','eventoId',ev)).find(i=>i.participanteId===pid&&i.estado!=='CANCELADO');
  if(dup)return toast('Ya está inscripto en este evento');
  const e=(await getDoc(doc(db,'eventos',ev))).data(),token=genToken();
  const act=(await where1('inscripciones','eventoId',ev)).filter(i=>['CONFIRMADO','ACREDITADO'].includes(i.estado)).length;if(e.cupo&&act>=e.cupo&&(est||'CONFIRMADO')==='CONFIRMADO'){if(!confirm('Cupo completo ('+e.cupo+'). ¿Anotar en LISTA DE ESPERA?'))return;est='ESPERA'}
  const i={eventoId:ev,eventoNombre:e.nombre,participanteId:pid,tipoParticipante:tipo,nombre,vehiculo,fechaInscripcion:serverTimestamp(),estado:est||'CONFIRMADO',tokenQR:token,acreditado:false,...extra,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
  await setDoc(doc(db,'inscripciones',token),i);log('inscripcion','inscripciones',token);
  toast('Inscripción creada');showTicket({id:token,...i});
}

let scanner=null;
const offAccredit=async ref=>{try{const s=await getDocFromCache(ref);if(!s.exists())return{k:'bad'};const i=s.data();if(i.estado==='CANCELADO')return{k:'bad'};if(i.estado==='PREINSCRIPTO'||i.estado==='ESPERA')return{k:'pend',i};const sel=$('#evsel')?.value;if(sel&&i.eventoId!==sel)return{k:'other',i};if(i.acreditado)return{k:'warn',i};updateDoc(ref,{acreditado:true,estado:'ACREDITADO',fechaAcreditacion:serverTimestamp(),usuarioAcreditacion:me.email,updatedAt:serverTimestamp()}).catch(()=>{});return{k:'ok',i,off:true}}catch{return{k:'nocache'}}};
acts.lst=async k=>{const ev=$('#evsel')?.value;if(!ev)return;const ins=(await where1('inscripciones','eventoId',ev)).filter(i=>i.estado!=='CANCELADO');const hr=d=>d?.toDate?d.toDate().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
 const l=k==='in'?ins.filter(i=>i.acreditado).sort((x,y)=>(x.fechaAcreditacion?.seconds||0)-(y.fechaAcreditacion?.seconds||0)):ins.filter(i=>!i.acreditado).sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)));
 modal(`<h3>${k==='in'?'Ingresaron':'Faltan ingresar'} (${l.length} de ${ins.length})</h3><div class="wrap"><table>${l.map(i=>`<tr><td>${esc(i.nombre)}<br><small>${esc(i.vehiculo||'')}</small></td><td>${k==='in'?hr(i.fechaAcreditacion):badge(i.estado)}</td>${k!=='in'&&i.estado==='CONFIRMADO'?`<td><button class="b" data-a="acr1l" data-i="${i.id}">✅ Acreditar</button></td>`:''}</tr>`).join('')||'<tr><td class="empty">Nadie por ahora</td></tr>'}</table></div><button class="b l big" data-a="cm">Cerrar</button>`)};
async function accredit(token){
  const ref=doc(db,'inscripciones',token.trim());let out;
  try{if(!navigator.onLine)throw{code:'unavailable'};out=await Promise.race([new Promise((_,no)=>setTimeout(()=>no({code:'unavailable'}),6000)),runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists())return{k:'bad'};const i=s.data();if(i.estado==='CANCELADO')return{k:'bad'};if(i.estado==='PREINSCRIPTO'||i.estado==='ESPERA')return{k:'pend',i};const sel=$('#evsel')?.value;if(sel&&i.eventoId!==sel)return{k:'other',i};
    if(i.acreditado)return{k:'warn',i};
    tx.update(ref,{acreditado:true,estado:'ACREDITADO',fechaAcreditacion:serverTimestamp(),usuarioAcreditacion:me.email,updatedAt:serverTimestamp()});return{k:'ok',i}})])}catch(x){out=(x&&['unavailable','deadline-exceeded','failed-precondition'].includes(x.code))?await offAccredit(ref):{k:'bad'}}
  const hr=d=>d?.toDate?d.toDate().toLocaleString('es-AR'):new Date().toLocaleString('es-AR');
  if(out.k==='ok'){addDoc(collection(db,'acreditaciones'),{inscripcionId:token,eventoId:out.i.eventoId,nombre:out.i.nombre,usuario:me.email,createdAt:serverTimestamp()});log('acreditacion','inscripciones',token)}
  $('#res').innerHTML=out.k==='ok'?`<div class="res ok">🟢 ACREDITACIÓN EXITOSA<br><b>${esc(out.i.nombre)}</b><br>${esc(out.i.vehiculo)}<br>Hora: ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}${out.off?'<br><small>📴 Guardado en el dispositivo, se sincroniza al volver internet</small>':''}</div>`
   :out.k==='warn'?`<div class="res warn">🟡 YA ACREDITADO<br><b>${esc(out.i.nombre)}</b><br>${hr(out.i.fechaAcreditacion)}<br>Por: ${esc(out.i.usuarioAcreditacion)}</div>`
   :out.k==='pend'?`<div class="res warn">⏳ ${esc(out.i.estado)}<br><b>${esc(out.i.nombre)}</b><br><small>Falta confirmar la inscripción. Confirmala en el evento y volvé a escanear.</small></div>`:out.k==='nocache'?`<div class="res warn">📴 Sin conexión: este QR no está descargado en el dispositivo.<br><small>Abrí Acreditación con internet para descargar el evento.</small></div>`:out.k==='other'?`<div class="res warn">🟠 QR de otro evento<br>${esc(out.i.eventoNombre)}</div>`:`<div class="res bad">🔴 QR NO VÁLIDO</div>`;
  evStats();
}
async function evStats(){const ev=$('#evsel').value;if(!ev)return;const ins=await where1('inscripciones','eventoId',ev);const a=ins.filter(i=>i.acreditado).sort((x,y)=>(y.fechaAcreditacion?.seconds||0)-(x.fechaAcreditacion?.seconds||0));
  $('#stats').innerHTML=`<div class="card"><div class="num">${a.length} / ${ins.filter(i=>i.estado!=='CANCELADO').length}</div>ACREDITADOS<hr>Últimas:<br>${a.slice(0,5).map(i=>esc(i.nombre)).join('<br>')||'—'}<br><button class="b l" data-a="lst" data-i="in">Ver quiénes ingresaron</button><button class="b l" data-a="lst" data-i="out">Ver quiénes faltan</button><hr><small>📥 ${ins.length} inscripciones guardadas para uso sin conexión</small></div>`}
async function acredView(modo,evId){
  loading();const evs=(await all('eventos')).filter(e=>e.estado==='PUBLICADO');
  main(`<h2>${modo?'MODO EVENTO':'ACREDITACIÓN'}</h2><select id="evsel">${evs.map(e=>`<option value="${e.id}"${e.id===evId?' selected':''}>${esc(e.nombre)}</option>`).join('')||'<option value="">Sin eventos publicados</option>'}</select><button class="b big" data-a="scan"${modo?' style="position:fixed;left:1em;right:1em;bottom:calc(1em + env(safe-area-inset-bottom));width:auto;z-index:6;padding:1.4em;font-size:1.3rem"':''}>ESCANEAR QR</button><div id="res"></div><div id="stats"></div>${modo?'<div style="height:6em"></div>':''}`);
  $('#evsel').onchange=evStats;evStats();
}
let scanBusy=false;
const closeScan=async()=>{if(scanner){try{await scanner.stop()}catch{}try{scanner.clear()}catch{}scanner=null}$('#scan').classList.add('hide');$('#reader').innerHTML=''};
acts.scanx=closeScan;
acts.scan=async()=>{
  const sel=$('#evsel');if(!sel||!sel.value)return toast('Elegí un evento primero');
  await closeScan();scanBusy=false;$('#res').innerHTML='';
  $('#scev').textContent=sel.selectedOptions[0].textContent;$('#scan').classList.remove('hide');
  scanner=new Html5Qrcode('reader');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const m=Math.floor(Math.min(w,h)*.7);return{width:m,height:m}}},async t=>{if(scanBusy)return;scanBusy=true;if(navigator.vibrate)navigator.vibrate(80);await closeScan();accredit(t)})}
  catch{await closeScan();toast('No se pudo abrir la cámara: revisá los permisos (requiere HTTPS)')}
};
acts.acev=id=>{document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.i==='acred'));acredView(false,id).catch(x=>main('<div class="empty">Error: '+esc(x.code||x.message)+'</div>'))};

async function dash(){
  loading();const g=c=>all(c).catch(()=>[]);
  const[so,e,i,cu,ing,egr,au]=await Promise.all(['socios','eventos','inscripciones','cuotas','ingresos','egresos','auditoria'].map(g));
  const sum=a=>a.reduce((t,x)=>t+(+x.importe||0),0),c=(n,t)=>`<div class="card"><div class="num">${n}</div>${t}</div>`;
  const I=sum(ing),E=sum(egr),mx=Math.max(1,I,E),bar=(v,col)=>`<div style="background:${col};height:12px;width:${v/mx*100}%;border-radius:6px;margin:3px 0"></div>`;
  const prox=e.filter(x=>x.estado==='PUBLICADO'&&(x.fecha||'')>=today()).sort((x,y)=>x.fecha.localeCompare(y.fecha)).slice(0,4);
  const rec=au.sort((x,y)=>(y.fecha?.seconds||0)-(x.fecha?.seconds||0)).slice(0,6);
  main(`<h2>Panel</h2><div class="grid">${c(so.filter(x=>x.estado==='ACTIVO').length,'Socios activos')}${c(cu.filter(x=>x.estado!=='PAGADA').length,'Cuotas pendientes')}${c(i.filter(x=>x.estado!=='CANCELADO').length,'Participantes')}${c(i.filter(x=>x.acreditado).length,'Acreditados')}${c(money(I),'Ingresos')}${c(money(E),'Egresos')}${c(money(I-E),'Saldo')}</div><div class="card"><b>Ingresos vs egresos</b>${bar(I,'#2e7d32')}${bar(E,'#7a1426')}</div><div class="card"><b>Próximos eventos</b><br>${prox.map(x=>`${esc(x.fecha)} — ${esc(x.nombre)}`).join('<br>')||'<span class="empty">Sin eventos próximos</span>'}</div><div class="card"><b>Últimas actividades</b><br>${rec.map(x=>`${esc(x.usuario)} · ${esc(x.accion)} · ${esc(x.entidad)}`).join('<br>')||'<span class="empty">Sin actividad</span>'}</div>`);

async function clubView(){loading();
 const g=c=>all(c).catch(()=>null),[so,cu,ing,egr,ve]=await Promise.all([g('socios'),g('cuotas'),g('ingresos'),g('egresos'),g('vehiculos')]);
 const hoy=today(),sum=a=>a.reduce((s,x)=>s+(+x.importe||0),0),row=h=>`<div style="display:flex;flex-wrap:wrap;margin:-.3em">${h}</div>`;
 const cnt=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])))};
 let h='<h2>📈 Estadísticas del club</h2>';
 if(so)h+=row(statBox(so.length,'Socios')+statBox(so.filter(x=>x.estado==='ACTIVO').length,'Activos')+statBox(so.filter(x=>x.estado==='SUSPENDIDO').length,'Suspendidos')+statBox(so.filter(x=>x.estado==='BAJA').length,'Bajas'));
 if(cu){const venc=x=>x.estado!=='PAGADA'&&(x.estado==='VENCIDA'||(x.vencimiento&&x.vencimiento<hoy)),pag=cu.filter(x=>x.estado==='PAGADA'),ven=cu.filter(venc),pen=cu.filter(x=>x.estado!=='PAGADA'&&!venc(x));
  const per=[...new Set(cu.map(x=>x.periodo).filter(Boolean))].sort().pop(),cp=per?cu.filter(x=>x.periodo===per):[],cob=cp.length?Math.round(cp.filter(x=>x.estado==='PAGADA').length/cp.length*100):0;
  h+='<h3>💳 Cuotas</h3>'+row(statBox(pag.length,'Pagadas')+statBox(pen.length,'Pendientes')+statBox(ven.length,'Vencidas')+statBox(money(sum(ven)),'Adeudado')+(per?statBox(cob+'%','Cobranza '+esc(per)):''));
  const gm={};ven.forEach(x=>{(gm[x.socio||'?']??=[]).push(x)});
  const mor=Object.entries(gm).map(([k,a])=>{const s=so&&(so.find(z=>z.numero+' '+z.apellido===k)||so.find(z=>k.startsWith(z.numero+' ')));return{k,a:a.sort((p,q)=>String(p.periodo).localeCompare(String(q.periodo))),t:sum(a),s,tel:waNorm(s?.telefono||s?.whatsapp)}}).sort((p,q)=>q.t-p.t);
  window._mor=mor;
  h+=`<div class="card"><h3>⚠️ Socios con cuotas vencidas (${mor.length})</h3>${mor.slice(0,60).map((m,k)=>`<div style="padding:.5em 0;border-bottom:1px solid var(--bd)"><b>${esc(m.k)}</b><br><small>${m.a.map(c=>esc(c.periodo)).join(', ')} · ${money(m.t)}</small><br>${m.tel?`<button class="b" data-a="mor" data-i="${k}">💬 Avisar por WhatsApp</button>`:'<small>Sin teléfono válido cargado</small>'}</div>`).join('')||'<div class="empty">Sin deuda vencida 🎉</div>'}</div>`}
 else h+='<p><small>Cuotas: tu rol no tiene acceso.</small></p>';
 if(ing&&egr){const mm=a=>{const m={};a.forEach(x=>{const k=(x.fecha||'').slice(0,7);if(k)m[k]=(m[k]||0)+(+x.importe||0)});return m},mI=mm(ing),mE=mm(egr),ks=[...new Set([...Object.keys(mI),...Object.keys(mE)])].sort().slice(-6);
  h+='<h3>💰 Finanzas</h3>'+row(statBox(money(sum(ing)),'Ingresos')+statBox(money(sum(egr)),'Egresos')+statBox(money(sum(ing)-sum(egr)),'Saldo'))+`<div class="card"><b>Ingresos por mes</b>${statBars(ks.map(k=>[k,mI[k]||0]),money)}</div><div class="card"><b>Egresos por mes</b>${statBars(ks.map(k=>[k,mE[k]||0]),money)}</div>`}
 if(ve){const V=ve.map(vehParse);h+='<h3>🚗 Vehículos del club</h3>'+row(statBox(ve.length,'Vehículos')+statBox(cnt(V,v=>v.marca).length,'Marcas'))+`<div class="card"><b>Por marca</b>${statBars(cnt(V,v=>v.marca).slice(0,15))}</div><div class="card"><b>Por década</b>${statBars(cnt(V,v=>v.anio?Math.floor(v.anio/10)*10+'s':'').sort((a,b)=>a[0].localeCompare(b[0])))}</div>`}
 const[evs,ins]=await Promise.all([g('eventos'),g('inscripciones')]);
 if(evs&&ins){const ye={};evs.forEach(e=>{const y=(e.fecha||'').slice(0,4);if(y)ye[e.id]=y});const by={};
  ins.filter(i=>i.estado!=='CANCELADO'&&ye[i.eventoId]).forEach(i=>{const y=ye[i.eventoId],o=by[y]??={n:0,a:0,s:0,k:new Set(),m:{}};o.n++;if(i.acreditado||i.estado==='ACREDITADO')o.a++;if(i.tipoParticipante==='SOCIO')o.s++;o.k.add(i.tipoParticipante==='SOCIO'?i.participanteId:(i.dni||i.participanteId));const mk=vehParse(i).marca;if(mk)o.m[mk]=(o.m[mk]||0)+1});
