 if(ve){const V=ve.map(vehParse);h+='<h3>🚗 Vehículos del club</h3>'+row(statBox(ve.length,'Vehículos')+statBox(cnt(V,v=>v.marca).length,'Marcas'))+`<div class="card"><b>Por marca</b>${statBars(cnt(V,v=>v.marca).slice(0,15),undefined,n=>mkImg(n,24))}</div><div class="card"><b>Por década</b>${statBars(cnt(V,v=>v.anio?Math.floor(v.anio/10)*10+'s':'').sort((a,b)=>a[0].localeCompare(b[0])))}</div>`}
 const[evs,ins]=await Promise.all([g('eventos'),g('inscripciones')]);
 if(evs&&ins){const ye={};evs.forEach(e=>{const y=(e.fecha||'').slice(0,4);if(y)ye[e.id]=y});const by={};
  ins.filter(i=>i.estado!=='CANCELADO'&&ye[i.eventoId]).forEach(i=>{const y=ye[i.eventoId],o=by[y]??={n:0,a:0,s:0,k:new Set(),m:{}};o.n++;if(i.acreditado||i.estado==='ACREDITADO')o.a++;if(i.tipoParticipante==='SOCIO')o.s++;o.k.add(i.tipoParticipante==='SOCIO'?i.participanteId:(i.dni||i.participanteId));insVehs(i).forEach(v=>{if(v.marca)o.m[v.marca]=(o.m[v.marca]||0)+1})});
  const ys=Object.keys(by).sort();if(ys.length)h+=`<h3>📆 Comparación por año</h3><div class="card wrap"><table><tr><th>Año</th><th>Inscriptos</th><th>Acreditados</th><th>Socios</th><th>Repiten</th><th>Marca #1</th></tr>${ys.map((y,k)=>{const o=by[y],pv=k?by[ys[k-1]].k:null,top=Object.entries(o.m).sort((a,b)=>b[1]-a[1])[0];return`<tr><td>${y}</td><td>${o.n}</td><td>${o.a}</td><td>${o.s}</td><td>${pv?[...o.k].filter(x=>pv.has(x)).length:'-'}</td><td>${top?esc(top[0]):'-'}</td></tr>`}).join('')}</table></div><p><small>"Repiten" cuenta socios y invitados con el mismo DNI en el año anterior.</small></p>`}
 main(h)}
VIEWS.club=['Estadísticas',clubView];
acts.mor=k=>{const m=(window._mor||[])[+k];if(!m||!m.tel)return toast(WA_ERR);const nom=(m.s?.nombre||'').split(' ')[0]||'socio';
 waGo(m.tel,`Hola ${nom} 👋\n\nTe escribimos del *Club Autos Clásicos Pilar*. Figuran cuotas pendientes:\n${m.a.map(c=>'• '+c.periodo+' — '+money(c.importe)).join('\n')}\n\nTotal: *${money(m.t)}*\n\nCuando abones avisanos por acá y te registramos el pago. ¡Gracias!`)};

const backupCheck=()=>{if(role!=='ADMIN'||window._bk)return;window._bk=1;let l=0,q=0;try{l=+localStorage.getItem('acp-lastbackup')||0;q=+localStorage.getItem('acp-bkask')||0}catch{}
 const u=Math.max(l,q);
 if(!u||Date.now()-u>=7*864e5)setTimeout(()=>{try{localStorage.setItem('acp-bkask',String(Date.now()))}catch{}if(confirm((l?'Hace '+Math.floor((Date.now()-l)/864e5)+' días que no hacés un respaldo.':'Todavía no hiciste ningún respaldo.')+' ¿Descargarlo ahora?'))acts.exp()},2500)};
const rulesCheck=()=>{if(!window._rulesErr||$('#rb'))return;const d=document.createElement('div');d.id='rb';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:90;background:#b91c1c;color:#fff;padding:.6em 1em;text-align:center;font-size:.9rem';
 d.innerHTML='⚠️ Firestore bloqueó la lectura de tu rol ('+esc(window._rulesErr)+'). Revisá las reglas en Firebase → Firestore → Reglas. <button onclick="this.parentNode.remove()" style="margin-left:.6em;min-height:0;padding:.1em .6em">✕</button>';document.body.append(d)};
acts.diag=async()=>{const o=$('#dg'),R=[];o.innerHTML='Probando…';
 const T=async(n,f)=>{try{await f();R.push('✅ '+n)}catch(e){R.push('❌ '+n+' — '+(e.code||e.message))}};
 await T('Leer mi rol',async()=>{const s=await getDoc(doc(db,'users',me.uid));if(!s.exists())throw{code:'no existe users/'+me.uid};if(s.data().role!==role)throw{code:'el rol guardado es '+s.data().role}});
 for(const c of ['socios','vehiculos','eventos','inscripciones','participantes','cuotas','ingresos','egresos','comunicados','agenda','galeria','config','auditoria','ubicaciones','chat'])await T('Leer '+c,()=>getDocs(query(collection(db,c),limit(1))));
 await T('Link público (sin login): leer evento',async()=>{const ev=(await getDocs(query(collection(db,'eventos'),limit(1)))).docs[0];if(!ev)throw{code:'no hay eventos cargados'};window._pub=window._pub||initializeApp(firebaseConfig,'pub');await getDoc(doc(getFirestore(window._pub),'eventos',ev.id))});
 await T('Link público (sin login): leer inscripción',async()=>{window._pub=window._pub||initializeApp(firebaseConfig,'pub');await getDoc(doc(getFirestore(window._pub),'inscripciones','prueba-diagnostico'))});
 let l=0;try{l=+localStorage.getItem('acp-lastbackup')||0}catch{}
 o.innerHTML=R.map(esc).join('<br>')+'<p><small>Si ves ❌ permission-denied, revisá las reglas de Firestore. Último respaldo: '+(l?new Date(l).toLocaleDateString('es-AR'):'nunca')+'</small></p>'};

/* ==== INSCRIPCIÓN PÚBLICA POR LINK ==== */
const insLink=id=>location.origin+location.pathname+'#inscripcion='+id;
acts.insl=async id=>{const e=(await getDoc(doc(db,'eventos',id))).data(),ab=!!e.inscripcionAbierta;
 modal(`<h3>Inscripción por link</h3><p>Estado: <b>${ab?'🟢 ABIERTA':'🔴 CERRADA'}</b></p><input readonly value="${insLink(id)}" onclick="this.select()"><div class="grid"><button class="b l" data-a="insc" data-i="${id}">COPIAR LINK</button><button class="b" data-a="insw" data-i="${id}">COMPARTIR WHATSAPP</button></div><button class="b ${ab?'g':''} big" data-a="inst" data-i="${id}|${ab?0:1}">${ab?'CERRAR INSCRIPCIÓN':'ABRIR INSCRIPCIÓN'}</button><p><small>Quienes se anoten quedan como PREINSCRIPTO hasta que los confirmes.</small></p><button class="b l big" data-a="cm">Cerrar</button>`)};
acts.insc=async id=>{await navigator.clipboard.writeText(insLink(id));toast('Link copiado')};
acts.insw=async id=>{const e=(await getDoc(doc(db,'eventos',id))).data();window.open('https://wa.me/?text='+encodeURIComponent(`🚗 Inscripción abierta: ${e.nombre}\n${e.fecha||''} ${e.hora||''} · ${e.lugar||''}\n\nAnotate acá:\n${insLink(id)}${locTxt(e)}`),'_blank')};
acts.inst=async k=>{const[id,v]=k.split('|');await updateDoc(doc(db,'eventos',id),{inscripcionAbierta:v==='1',updatedAt:serverTimestamp()});acts.insl(id)};
async function insView(id){
 await loadMarcas();
 const P=$('#pub');P.classList.remove('hide');P.innerHTML='<div class="loader">Cargando…</div>';
 try{const prev=localStorage.getItem('ins-'+id);if(prev){location.hash='#acreditacion='+prev;return pubView(prev)}}catch{}
 try{const sn=await getDoc(doc(db,'eventos',id));if(!sn.exists())throw 0;const e=sn.data();
  const head=`<div style="text-align:center"><img src="logo.png" alt="" style="max-width:130px;max-height:110px" onerror="this.remove()"><h2>${esc(e.nombre)}</h2><p>${esc(e.fecha||'')} ${esc(e.hora||'')} · ${esc(e.lugar||'')}</p>${ll(e)?`<p><a href="${mapsUrl(e)}" target="_blank" rel="noopener">📍 Cómo llegar</a></p>`:''}</div>`;
  if(e.estado!=='PUBLICADO'||!e.inscripcionAbierta){P.innerHTML=`<div class="card">${head}<div class="res warn">La inscripción está cerrada</div></div>`;return}
  const F=(n,l,t='text')=>`<label>${l}</label><input name="${n}" type="${t}" autocomplete="off">`;
  P.innerHTML=`<div class="card">${head}<h3>Inscripción</h3>${F('nombre','Nombre *')}${F('apellido','Apellido *')}${F('dni','DNI *','tel')}${F('whatsapp','WhatsApp * (con código de área, sin 0 ni 15)','tel')}${F('email','Email (opcional)','email')}<label>¿Sos socio del club?</label><select name="esSocio"><option>NO</option><option>SI</option></select><h3>Vehículos</h3><small>Si venís con más de un vehículo, agregalos acá.</small>${vehBlock()}<label>Foto (opcional)</label><input name="foto" type="file" accept="image/*"><input name="web" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button class="b big" data-a="insgo" data-i="${id}">INSCRIBIRME</button><p><small>Tu inscripción quedará pendiente hasta que la organización la confirme. Vas a recibir tu QR de acceso.</small></p></div>`;
 }catch(x){console.error('insView',x);P.innerHTML='<div class="res bad">🔴 ENLACE NO VÁLIDO</div><p style="text-align:center"><small>'+esc(x&&x.code?x.code:'evento-no-existe')+'</small></p>'}
}
acts.insgo=async id=>{
 const d=Object.fromEntries([...document.querySelectorAll('#pub [name]')].map(e=>[e.name,e.value.trim().slice(0,100)]));
 if(d.web)return;
 if(!d.nombre||!d.apellido)return toast('Completá nombre y apellido');
 if(d.dni.replace(/\D/g,'').length<6)return toast('Revisá el DNI');
 const wn=waNorm(d.whatsapp);if(!wn)return toast(WA_ERR);d.whatsapp=wn;const vs=readVehs(document.querySelector('#pub'));if(!vs)return;
 const b=document.querySelector('#pub .b.big');b.disabled=true;b.textContent='Enviando…';
 try{const e=(await getDoc(doc(db,'eventos',id))).data(),t=genToken();let foto='';const ff=document.querySelector('#pub [name=foto]')?.files?.[0];if(ff)try{foto=await shrink(ff)}catch{}
  await setDoc(doc(db,'inscripciones',t),{foto,eventoId:id,eventoNombre:e.nombre,participanteId:t,tipoParticipante:'INVITADO',nombre:d.nombre+' '+d.apellido,...vehExtra(vs),dni:d.dni,telefono:d.whatsapp,whatsapp:d.whatsapp,email:d.email,esSocio:d.esSocio,origen:'WEB',fechaInscripcion:serverTimestamp(),estado:'PREINSCRIPTO',tokenQR:t,acreditado:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  try{localStorage.setItem('ins-'+id,t)}catch{}
  location.hash='#acreditacion='+t;pubView(t);
 }catch(x){b.disabled=false;b.textContent='INSCRIBIRME';toast('No se pudo enviar. Revisá tu conexión e intentá de nuevo.')}
};
const m=location.hash.match(/^#acreditacion=(.+)$/);const mi=location.hash.match(/^#inscripcion=(.+)$/);
Promise.all([splashDone,m?Promise.resolve():authReady]).then(()=>{
  $('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),600);
  if(m)pubView(decodeURIComponent(m[1]));else if(mi)insView(decodeURIComponent(mi[1]));else{started=true;route()}
});
</script>
